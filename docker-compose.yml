# Basic VMS appliance stack (Linux host).
#
# Network model:
#   - app and mediamtx use host networking. This gives WebRTC real LAN host
#     candidates and lets ONVIF WS-Discovery multicast reach cameras.
#   - Exposed: 3000/tcp (UI, API, authenticated media proxy) and 8189/udp (WebRTC
#     media); 3478 + relay ports if the optional TURN profile is enabled.
#   - With the https profile, Caddy serves 443/tcp (and 80/tcp, redirecting) and
#     the app listens on localhost only (APP_HOST=127.0.0.1).
#   - Everything else (MediaMTX API/HLS/WHEP/playback/RTSP, PostgreSQL) listens
#     on localhost only.
#
# Configure via .env (see .env.example). Start: docker compose up -d
# With TURN for remote viewers behind strict NAT: docker compose --profile turn up -d
# With HTTPS: set HTTPS_DOMAIN (+ HTTPS_TLS) and COMPOSE_PROFILES=https in .env

x-recordings: &recordings
  type: volume
  source: vms_recordings
  target: /recordings

services:
  # Recordings are written by MediaMTX and pruned by the app (FIFO/retention); both
  # run as uid 1000 so the app can delete what MediaMTX writes.
  init-permissions:
    image: busybox:1.36
    command: ["sh", "-c", "chown 1000:1000 /recordings && chmod 0775 /recordings"]
    volumes:
      - *recordings
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-vms_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-basic_vms}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vms_user} -d ${POSTGRES_DB:-basic_vms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:1.11.0
    network_mode: host
    user: "1000:1000"
    environment:
      # Public/WAN address(es) advertised to remote WebRTC viewers (comma-separated)
      - MTX_WEBRTCADDITIONALHOSTS=${PUBLIC_HOST:-}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - *recordings
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      # 127.0.0.1 behind the HTTPS front end, so plain HTTP is not reachable from outside
      - HOST=${APP_HOST:-0.0.0.0}
      # true: trust X-Forwarded-* from a proxy on this host (the https profile)
      - TRUST_PROXY=${TRUST_PROXY:-}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vms_user}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-basic_vms}?schema=public
      # Optional: a generated secret is persisted in the database when unset
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      - MEDIAMTX_API_URL=http://127.0.0.1:9997
      - MEDIAMTX_WEBRTC_URL=http://127.0.0.1:8889
      - MEDIAMTX_HLS_URL=http://127.0.0.1:8888
      - MEDIAMTX_PLAYBACK_URL=http://127.0.0.1:9996
      - RECORDINGS_PATH=/recordings
      # Recording schedules are evaluated in this timezone
      - TZ=${TZ:-Asia/Kolkata}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - TURN_SERVER_HOST=${TURN_SERVER_HOST:-}
      - TURN_SECRET=${TURN_SECRET:-}
      - BASIC_VMS_LICENSE=${BASIC_VMS_LICENSE:-}
    volumes:
      - *recordings
      - vms_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      mediamtx:
        condition: service_started
    restart: unless-stopped

  # Optional HTTPS front end (Let's Encrypt or an internal CA), see deploy/Caddyfile.
  caddy:
    image: caddy:2.8.4-alpine
    profiles: ["https"]
    network_mode: host
    environment:
      - HTTPS_DOMAIN=${HTTPS_DOMAIN:-}
      - HTTPS_TLS=${HTTPS_TLS:-internal}
      - PORT=${PORT:-3000}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        test -n "$$HTTPS_DOMAIN" || { echo 'HTTPS_DOMAIN must be set in .env'; exit 1; };
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - vms_caddy_data:/data
      - vms_caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

  # Optional STUN/TURN relay for remote viewers behind symmetric NAT / CGNAT.
  coturn:
    image: coturn/coturn:4.6.2-alpine
    profiles: ["turn"]
    network_mode: host
    environment:
      - TURN_SECRET=${TURN_SECRET:-}
      - PUBLIC_HOST=${PUBLIC_HOST:-}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        test -n "$$TURN_SECRET" || { echo 'TURN_SECRET must be set in .env'; exit 1; };
        exec turnserver -c /etc/coturn/turnserver.conf --static-auth-secret="$$TURN_SECRET"
        $${PUBLIC_HOST:+--external-ip=$$PUBLIC_HOST}
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    restart: unless-stopped

volumes:
  vms_postgres_data:
    name: basic_vms_postgres_data
  vms_recordings:
    name: basic_vms_recordings
  vms_data:
    name: basic_vms_data
  vms_caddy_data:
    name: basic_vms_caddy_data
  vms_caddy_config:
    name: basic_vms_caddy_config
