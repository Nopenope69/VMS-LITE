name: Basic VMS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Test, Typecheck, Migrations, Licenses & SBOM
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vms_user
          POSTGRES_PASSWORD: vms_password
          POSTGRES_DB: basic_vms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vms_user -d basic_vms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck server and web client
        run: npm run typecheck

      - name: Build server and web client
        run: |
          npm run build
          npm run build:client

      # After the build: production-serving tests exercise the built client
      - name: Run automated test suite
        run: npm test

      - name: Apply migrations to PostgreSQL and check for schema drift
        env:
          DATABASE_URL: postgresql://vms_user:vms_password@localhost:5432/basic_vms?schema=public
        run: |
          npx prisma migrate deploy
          PGPASSWORD=vms_password psql -h localhost -U vms_user -d basic_vms -c 'CREATE DATABASE shadow_vms;'
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://vms_user:vms_password@localhost:5432/shadow_vms \
            --exit-code

      - name: Verify 100% Permissive Licensing Compliance (DEP-04)
        run: npm run audit:licenses

      - name: Generate Release CycloneDX SBOM (DEP-03)
        run: npm run generate:sbom

      - name: Archive SBOM and License Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: basic-vms-release-bom-and-notices
          path: |
            sbom.json
            third_party/notices/THIRD_PARTY_NOTICES.md
            third_party/licenses/
