# Coturn STUN/TURN Server Configuration for Basic VMS (LIVE-04)
# Deployment Tier: Package 1 Core (Local LAN + Mobile Remote Streaming)

# Network Listener Ports
listening-port=3478
tls-listening-port=5349

# IP Addresses to Listen On (0.0.0.0 binds to all available interfaces)
listening-ip=0.0.0.0

# Min and Max Relay Ports for WebRTC Media Streams
min-port=49152
max-port=65535

# Fingerprint in TURN messages (RFC 5389 requirement for WebRTC)
fingerprint

# Long-term credential mechanism via shared auth secret (RFC 5766 REST API)
use-auth-secret
# static-auth-secret is passed on the command line from TURN_SECRET (docker-compose),
# the same secret the control plane uses to mint short-lived TURN credentials.
realm=vms.local

# Stale nonce lifetime in seconds (10 minutes)
stale-nonce=600

# Performance & Isolation
no-stdout-log
simple-log
no-multicast-peers
no-cli
mobility
