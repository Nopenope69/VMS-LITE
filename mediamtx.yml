###############################################
# MediaMTX configuration for Basic VMS (MediaMTX v1.11)
#
# The control plane owns all camera paths: it adds them through the API and
# re-creates them on every scheduler tick, so none are declared here.
#
# Security model: every HTTP listener is bound to localhost. Browsers reach live
# and recorded video only through the control plane's authenticated
# /api/media/* proxy. Only the WebRTC UDP media port is exposed.
# (docker-compose runs this container with host networking.)
###############################################

logLevel: info
logDestinations: [stdout]

# Local-only access; nothing else listens on these ports from outside the host.
authMethod: internal
authInternalUsers:
- user: any
  pass:
  ips: ['127.0.0.1', '::1']
  permissions:
  - action: api
  - action: read
  - action: playback

# Control API (used by the control plane only)
api: yes
apiAddress: 127.0.0.1:9997
metrics: no
pprof: no

# Recorded fMP4 playback (proxied as /api/media/playback)
playback: yes
playbackAddress: 127.0.0.1:9996

# RTSP re-stream, local only (e.g. for exports or third-party tools on the box)
rtsp: yes
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
rtmp: no
srt: no

# HLS fallback (proxied as /api/media/hls). Muxers start on demand to save CPU.
hls: yes
hlsAddress: 127.0.0.1:8888
hlsAlwaysRemux: no
hlsVariant: lowLatency

# WebRTC: WHEP signalling is local (proxied as /api/media/whep); media uses UDP 8189.
webrtc: yes
webrtcAddress: 127.0.0.1:8889
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: yes
# Add the public/WAN address here (or via MTX_WEBRTCADDITIONALHOSTS) for remote viewers.
webrtcAdditionalHosts: []

# Defaults applied to every camera path the control plane creates.
pathDefaults:
  # Recording is switched per camera by the control plane's scheduler.
  record: no
  # Timestamps are UTC (the container has no timezone data). The control plane's
  # segment indexer scans this directory, so no completion hook is required.
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 60s
  # Retention and disk-full rollover are enforced by the control plane.
  recordDeleteAfter: 0s
  # Pull cameras over TCP: reliable across Wi-Fi, VPN and WAN links to remote sites.
  rtspTransport: tcp

paths: {}
